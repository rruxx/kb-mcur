[package]
name = "key-cursor"
version = "0.1.0"
edition = "2024"

[dependencies]
x11rb = { version = "0.13", features = ["randr", "shape"] }
tiny-skia = "0.11"
fontdue = "0.9"
anyhow = "1"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-backend = { version = "0.3", features = ["client_system"] }

[profile.dev]
opt-level = 1

[profile.dev.package.tiny-skia]
opt-level = 2

[profile.dev.package.fontdue]
opt-level = 2

[[bin]]
name = "key-cursor"
path = "src/main.rs"
